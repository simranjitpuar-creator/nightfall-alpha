name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Ruff
        run: pip install ruff && ruff check src tests streamlit_app.py

      - name: Unit tests
        run: python -m unittest discover -s tests
