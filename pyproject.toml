[project]
name = "nightfall-alpha"
version = "0.1.0"
description = "Dashboard and research pipeline for overnight-effect trading strategies."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.29",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "yfinance>=0.2",
  "pandas-datareader>=0.10",
]

[project.optional-dependencies]
streamlit = [
  "streamlit>=1.38",
  "plotly>=5.24",
]
broker = [
  "ib-insync>=0.9.86",
]
dev = [
  "ruff>=0.6",
]

[project.scripts]
nightfall-alpha = "nightfall_alpha.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
"src/nightfall_alpha/dashboard/app.py" = ["B008"]  # FastAPI Body(...) defaults are the framework idiom
"streamlit_app.py" = ["E402"]  # sys.path bootstrap must precede package imports
